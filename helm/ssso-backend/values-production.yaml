# Production values for Shadow SSO Backend deployment
# This file configures the application for production use with existing MongoDB
#
# REQUIRED KUBERNETES SECRETS (must be created before deployment):
#
# 1. sso-signing-key - RSA private key for JWT token signing
#    kubectl create secret generic sso-signing-key --from-file=private.pem=<path-to-key>
#    Keys: private.pem (RSA private key in PEM format)
#
# 2. ssso-initial-admin-credentials - Initial admin user credentials
#    kubectl create secret generic ssso-initial-admin-credentials \
#      --from-literal=SSSO_INITIAL_ADMIN_EMAIL=admin@pilab.hu \
#      --from-literal=SSSO_INITIAL_ADMIN_PASSWORD=<strong-password> \
#      --from-literal=SSSO_INITIAL_ADMIN_FIRST_NAME=Admin \
#      --from-literal=SSSO_INITIAL_ADMIN_LAST_NAME=PiLab
#    Keys: SSSO_INITIAL_ADMIN_EMAIL, SSSO_INITIAL_ADMIN_PASSWORD,
#          SSSO_INITIAL_ADMIN_FIRST_NAME, SSSO_INITIAL_ADMIN_LAST_NAME
#
# 3. ssso-config - Application configuration secrets (MongoDB URI)
#    kubectl create secret generic ssso-config \
#      --from-literal=SSSO_MONGO_URI='mongodb://user:pass@host:27017/shadow_sso?authSource=shadow_sso'
#    Keys: SSSO_MONGO_URI
#
# Secrets are stored in KeePassXC vault at ~/Workspace/Passwords.kdbx (group: shadow-sso/)
# TODO: Evaluate OpenBao for dynamic secret management if scale demands it

replicaCount: 2

# Initial admin credentials - see header for required secret creation
initialAdmin:
  enabled: true
  createSecret: false
  secretName: "ssso-initial-admin-credentials"
  credentials:
    email: "admin@pilab.hu"
    firstName: "Admin"
    lastName: "PiLab"

image:
  repository: ghcr.io/pilab-dev/shadow-sso-backend
  pullPolicy: Always
  tag: "v1-connect-rpc"

imagePullSecrets:
  - name: ghcr-secret

serviceAccount:
  create: true
  annotations: {}

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001
  runAsUser: 1001
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: "/"
  hosts:
    - host: sso.pilab.hu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sso-pilab-hu-tls
      hosts:
        - sso.pilab.hu

# SSSO_MONGO_URI must be provided via extraEnvFrom referencing ssso-config Secret
config:
  SSSO_LOG_LEVEL: "info"
  SSSO_JSON_LOG: "true"
  SSSO_ISSUER_URL: "https://sso.pilab.hu"
  SSSO_MONGO_DB_NAME: "sso_dev"
  SSSO_SIGNING_KEY_PATH: "/etc/sso/keys/private.pem"
  SSSO_KEY_ROTATION_INTERVAL: "24h"
  SSSO_NEXTJS_LOGIN_URL: "https://sso.pilab.hu/login"

# Secret containing the RSA private key for signing tokens (see header for creation steps)
signingKeySecretName: "sso-signing-key"

createSigningKeySecret: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# MongoDB configuration - disabled since using existing instance
mongodb:
  enabled: false

nodeSelector: {}

tolerations:
  - key: node.kubernetes.io/disk-pressure
    operator: Exists
    effect: NoSchedule

affinity: {}

networkPolicy:
  enabled: true
  egress:
    mongoCIDRs: []

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/pilab-dev/shadow-sso-ui
    pullPolicy: Always
    tag: "latest"
  
  imagePullSecrets:
    - name: ghcr-secret
  
  podAnnotations: {}
  podSecurityContext: {}
  
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
    seccompProfile:
      type: RuntimeDefault
  
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  
  config:
    NEXT_PUBLIC_USE_MOCK_BACKEND: "false"
    NEXT_PUBLIC_RP_ID: "sso.pilab.hu"
    NEXT_PUBLIC_RP_NAME: "Shadow SSO"
    NEXT_PUBLIC_EXPECTED_ORIGIN: "https://sso.pilab.hu"
    SECRET_COOKIE_PASSWORD: "" # Set if you want to use cookie secret from secret
  
  secrets:
    secretName: "shadow-sso-frontend-secrets"
    createSecret: false
    cookieSecret: ""
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  persistence:
    enabled: false
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  
  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
  extraEnv: []
  extraEnvFrom: []

# OpenTelemetry tracing — send traces to Grafana Alloy
tracing:
  enabled: true
  otlpEndpoint: "http://tempo.observability:4317"
  serviceName: "shadow-sso"

extraEnv: []

extraEnvFrom:
  - secretRef:
      name: ssso-config

# Expected Kubernetes Secrets (must be pre-created before deployment):
# secrets:
#   signingKey:
#     secretName: "sso-signing-key"
#     keys: ["private.pem"]
#   adminCredentials:
#     secretName: "ssso-initial-admin-credentials"
#     keys: ["SSSO_INITIAL_ADMIN_EMAIL", "SSSO_INITIAL_ADMIN_PASSWORD",
#            "SSSO_INITIAL_ADMIN_FIRST_NAME", "SSSO_INITIAL_ADMIN_LAST_NAME"]
#   config:
#     secretName: "ssso-config"
#     keys: ["SSSO_MONGO_URI"]