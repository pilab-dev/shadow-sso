# Production values for Shadow SSO Backend deployment
# This file configures the application for production use with existing MongoDB

replicaCount: 2

initialAdmin:
  enabled: true
  createSecret: true
  secretName: "ssso-initial-admin-credentials"
  credentials:
    email: "admin@pilab.hu"
    password: "PilabSSO2025!"  # CHANGE THIS IMMEDIATELY AFTER FIRST LOGIN
    firstName: "Admin"
    lastName: "PiLab"

image:
  repository: ghcr.io/pilab-dev/shadow-sso-backend
  pullPolicy: IfNotPresent
  tag: "v1"

imagePullSecrets:
  - name: ghcr-secret

serviceAccount:
  create: true
  annotations: {}

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001
  runAsUser: 1001
  runAsNonRoot: true

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"  # Adjust based on your ingress controller
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: sso.pilab.hu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sso-pilab-hu-tls
      hosts:
        - sso.pilab.hu

# Configuration for the SSSO application
config:
  SSSO_LOG_LEVEL: "info"
  SSSO_ISSUER_URL: "https://sso.pilab.hu"
  SSSO_MONGO_URI: "mongodb://ssso_user:changeme_ssso_password_123!@mongodb.pishop-base.svc.cluster.local:27017/shadow_sso?authSource=shadow_sso"
  SSSO_MONGO_DB_NAME: "shadow_sso"
  SSSO_SIGNING_KEY_PATH: "/etc/sso/keys/private.pem"
  SSSO_KEY_ROTATION_INTERVAL: "24h"
  SSSO_NEXTJS_LOGIN_URL: "https://sso.pilab.hu/login"  # Assuming login UI is on same domain

# Secret containing the RSA private key for signing tokens
signingKeySecretName: "sso-signing-key"

