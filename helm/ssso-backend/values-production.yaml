resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# MongoDB configuration - disabled since using existing instance
mongodb:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

extraEnv: []

extraEnvFrom: []