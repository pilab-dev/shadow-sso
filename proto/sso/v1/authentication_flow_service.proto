syntax = "proto3";

package sso.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/pilab-dev/shadow-sso/gen/proto/sso/v1;ssov1";

// AuthenticationFlowService manages Keycloak-style authentication flows and their executions.
service AuthenticationFlowService {
  rpc ListAuthenticationFlows(ListAuthenticationFlowsRequest) returns (ListAuthenticationFlowsResponse);
  rpc ListAuthenticationExecutions(ListAuthenticationExecutionsRequest) returns (ListAuthenticationExecutionsResponse);
  rpc CreateAuthenticationFlow(CreateAuthenticationFlowRequest) returns (CreateAuthenticationFlowResponse);
  rpc UpdateAuthenticationFlow(UpdateAuthenticationFlowRequest) returns (UpdateAuthenticationFlowResponse);
  rpc DeleteAuthenticationFlow(DeleteAuthenticationFlowRequest) returns (google.protobuf.Empty);
  // Upserts the given executions into a flow.
  rpc UpdateAuthenticationExecutions(UpdateAuthenticationExecutionsRequest) returns (google.protobuf.Empty);
}

message AuthenticationFlow {
  string id = 1;
  string alias = 2;
  string display_name = 3;
  string description = 4;
  bool built_in = 5;
  bool top_level = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message AuthenticationExecution {
  string id = 1;
  string flow_id = 2;
  string execution = 3;
  string authenticator = 4;
  // REQUIRED, ALTERNATIVE or DISABLED.
  string requirement = 5;
  int32 priority = 6;
  string authentication_config = 7;
}

message AuthenticationExecutionInput {
  // Empty to create a new execution.
  string id = 1;
  string execution = 2 [(buf.validate.field).string.min_len = 1];
  string requirement = 3 [(buf.validate.field).string.min_len = 1];
}

message ListAuthenticationFlowsRequest {}

message ListAuthenticationFlowsResponse {
  repeated AuthenticationFlow flows = 1;
}

message ListAuthenticationExecutionsRequest {
  string flow_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListAuthenticationExecutionsResponse {
  repeated AuthenticationExecution executions = 1;
}

message CreateAuthenticationFlowRequest {
  string alias = 1 [(buf.validate.field).string.min_len = 1];
  string display_name = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3;
  bool built_in = 4;
  bool top_level = 5;
}

message CreateAuthenticationFlowResponse {
  AuthenticationFlow flow = 1;
}

message UpdateAuthenticationFlowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  optional string alias = 2;
  optional string display_name = 3;
  optional string description = 4;
}

message UpdateAuthenticationFlowResponse {
  AuthenticationFlow flow = 1;
}

message DeleteAuthenticationFlowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateAuthenticationExecutionsRequest {
  string flow_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated AuthenticationExecutionInput executions = 2;
}
