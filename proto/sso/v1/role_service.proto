syntax = "proto3";

package sso.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/pilab-dev/shadow-sso/gen/proto/sso/v1;ssov1";

// RoleService manages Keycloak-style realm/client roles and user role mappings.
service RoleService {
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc ListRealmRoles(ListRealmRolesRequest) returns (ListRealmRolesResponse);
  rpc ListClientRoles(ListClientRolesRequest) returns (ListClientRolesResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);
  rpc CreateCompositeRole(CreateCompositeRoleRequest) returns (CreateCompositeRoleResponse);

  rpc GetUserRoleMappings(GetUserRoleMappingsRequest) returns (GetUserRoleMappingsResponse);
  rpc GetUserClientRoleMappings(GetUserClientRoleMappingsRequest) returns (GetUserClientRoleMappingsResponse);
  rpc AddRealmRoleToUser(AddRealmRoleToUserRequest) returns (google.protobuf.Empty);
  rpc RemoveRealmRoleFromUser(RemoveRealmRoleFromUserRequest) returns (google.protobuf.Empty);
  rpc AddClientRoleToUser(AddClientRoleToUserRequest) returns (google.protobuf.Empty);
  rpc RemoveClientRoleFromUser(RemoveClientRoleFromUserRequest) returns (google.protobuf.Empty);
}

// Role mirrors domain.Role.
message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  bool composite = 4;
  bool client_role = 5;
  string container_id = 6;
  repeated string child_role_ids = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateRoleRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2;
  bool composite = 3;
  bool client_role = 4;
  // Owning client for client roles.
  string client_id = 5;
}

message CreateRoleResponse {
  Role role = 1;
}

message GetRoleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetRoleResponse {
  Role role = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message ListRealmRolesRequest {}

message ListRealmRolesResponse {
  repeated Role roles = 1;
}

message ListClientRolesRequest {
  string client_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListClientRolesResponse {
  repeated Role roles = 1;
}

message UpdateRoleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  optional string name = 2;
  optional string description = 3;
  optional bool composite = 4;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message ClientRoleRef {
  string client_id = 1 [(buf.validate.field).string.min_len = 1];
  string role_id = 2 [(buf.validate.field).string.min_len = 1];
}

message CreateCompositeRoleRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2;
  repeated string realm_role_ids = 3;
  repeated ClientRoleRef client_roles = 4;
}

message CreateCompositeRoleResponse {
  Role role = 1;
}

message GetUserRoleMappingsRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetUserRoleMappingsResponse {
  repeated Role realm_mappings = 1;
  repeated Role client_mappings = 2;
}

message GetUserClientRoleMappingsRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string client_id = 2 [(buf.validate.field).string.min_len = 1];
}

message GetUserClientRoleMappingsResponse {
  repeated Role roles = 1;
}

message AddRealmRoleToUserRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string role_id = 2 [(buf.validate.field).string.min_len = 1];
}

message RemoveRealmRoleFromUserRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string role_id = 2 [(buf.validate.field).string.min_len = 1];
}

message AddClientRoleToUserRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string client_id = 2 [(buf.validate.field).string.min_len = 1];
  string role_id = 3 [(buf.validate.field).string.min_len = 1];
}

message RemoveClientRoleFromUserRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string client_id = 2 [(buf.validate.field).string.min_len = 1];
  string role_id = 3 [(buf.validate.field).string.min_len = 1];
}
