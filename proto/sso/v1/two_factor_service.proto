syntax = "proto3";

package sso.v1;

import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/pilab-dev/shadow-sso/gen/proto/sso/v1;ssov1";

// TwoFactorService provides methods for managing Two-Factor Authentication (2FA) for users.
// Supports TOTP, HOTP, and Email-based MFA methods.
service TwoFactorService {
  // Initiates the setup process for TOTP.
  // Generates a new TOTP secret and a corresponding QR code URI for the authenticated user.
  // The user must verify with a TOTP code from their authenticator app to enable 2FA.
  rpc InitiateTOTPSetup(InitiateTOTPSetupRequest) returns (InitiateTOTPSetupResponse);

  // Initiates the setup process for HOTP.
  // Generates a new HOTP secret and a corresponding QR code URI for the authenticated user.
  rpc InitiateHOTPSetup(InitiateHOTPSetupRequest) returns (InitiateHOTPSetupResponse);

  // Verifies a TOTP code provided by the user during setup and enables 2FA if the code is valid.
  // This should be called after InitiateTOTPSetup.
  // Returns a list of recovery codes upon successful enablement.
  rpc VerifyAndEnableTOTP(VerifyAndEnableTOTPRequest) returns (VerifyAndEnableTOTPResponse);

  // Verifies an HOTP code provided by the user during setup and enables 2FA if the code is valid.
  // This should be called after InitiateHOTPSetup.
  rpc VerifyAndEnableHOTP(VerifyAndEnableHOTPRequest) returns (VerifyAndEnableHOTPResponse);

  // Initiates email-based MFA setup by sending an OTP to the user's email.
  rpc InitiateEmailMFASetup(InitiateEmailMFASetupRequest) returns (InitiateEmailMFASetupResponse);

  // Verifies the email OTP and enables email-based MFA.
  rpc VerifyAndEnableEmailMFA(VerifyAndEnableEmailMFARequest) returns (VerifyAndEnableEmailMFAResponse);

  // Initiates push MFA setup by registering a device token.
  rpc InitiatePushMFASetup(InitiatePushMFASetupRequest) returns (InitiatePushMFASetupResponse);

  // Enables push MFA for the user.
  rpc VerifyAndEnablePushMFA(VerifyAndEnablePushMFARequest) returns (VerifyAndEnablePushMFAResponse);

  // Registers a device token for push notifications.
  rpc RegisterPushDevice(RegisterPushDeviceRequest) returns (RegisterPushDeviceResponse);

  // Unregisters a device token.
  rpc UnregisterPushDevice(UnregisterPushDeviceRequest) returns (UnregisterPushDeviceResponse);

  // Allows users to respond to push MFA challenges.
  rpc RespondToPushChallenge(RespondToPushChallengeRequest) returns (RespondToPushChallengeResponse);

  // Gets the status of a push MFA challenge.
  rpc GetPushChallengeStatus(GetPushChallengeStatusRequest) returns (GetPushChallengeStatusResponse);

  // Sends an MFA code via the user's configured method (TOTP/HOTP/Email/Push).
  rpc SendMFAChallenge(SendMFAChallengeRequest) returns (SendMFAChallengeResponse);

  // Verifies an MFA code against the user's configured method.
  rpc VerifyMFAChallenge(VerifyMFAChallengeRequest) returns (VerifyMFAChallengeResponse);

  // Disables 2FA for the authenticated user.
  // May require current password or a 2FA code (if already enabled) for verification.
  rpc Disable2FA(Disable2FARequest) returns (google.protobuf.Empty);

  // Generates a new set of recovery codes for a user who already has 2FA enabled.
  // This invalidates any previously issued recovery codes.
  // Requires the user to be authenticated (e.g., via password or existing 2FA).
  rpc GenerateRecoveryCodes(GenerateRecoveryCodesRequest) returns (GenerateRecoveryCodesResponse);

  // --- Administrative MFA management ---

  // Reports every source that can trigger a second factor for a user, plus
  // warnings about configurations the login page cannot satisfy.
  // Self or admin (2fa:manage_others).
  rpc GetMFAStatus(GetMFAStatusRequest) returns (GetMFAStatusResponse);

  // Clears all second-factor state for a user (flags, TOTP secret, recovery
  // codes, registered methods and, optionally, WebAuthn devices).
  // Admin only (2fa:manage_others).
  rpc ResetUserMFA(ResetUserMFARequest) returns (ResetUserMFAResponse);

  // Sets or clears the per-user "MFA required" enforcement flag.
  // Admin only (2fa:manage_others).
  rpc SetUserMFARequired(SetUserMFARequiredRequest) returns (google.protobuf.Empty);

  // Reads the realm-wide MFA policy.
  rpc GetMFAPolicy(GetMFAPolicyRequest) returns (GetMFAPolicyResponse);

  // Sets the realm-wide MFA policy.
  // Admin only (2fa:manage_others).
  rpc SetMFAPolicy(SetMFAPolicyRequest) returns (google.protobuf.Empty);
}

// --- InitiateTOTPSetup ---
message InitiateTOTPSetupRequest {
  // Optional user_id for admin use cases. If empty, uses authenticated user context.
  string user_id = 1;
}

message InitiateTOTPSetupResponse {
  string secret = 1;         // The base32 encoded TOTP secret. (For manual entry if QR fails)
  string qr_code_uri = 2;    // The otpauth:// URI to be rendered as a QR code.
  // string issuer = 3;      // Issuer name shown in authenticator app (e.g., "YourAppName") - often part of qr_code_uri
  // string account_name = 4; // Account name shown in authenticator app (e.g., user's email) - often part of qr_code_uri
}

// --- VerifyAndEnableTOTP ---
message VerifyAndEnableTOTPRequest {
  string totp_code = 1 [(buf.validate.field).string.min_len = 1]; // The TOTP code from the user's authenticator app.
  // Optional user_id for admin use cases. If empty, uses authenticated user context.
  string user_id = 2;
}

message VerifyAndEnableTOTPResponse {
  repeated string recovery_codes = 1; // A new set of recovery codes.
}

// --- Disable2FA ---
message Disable2FARequest {
  // For security, disabling 2FA often requires re-authentication.
  string password_or_2fa_code = 1 [(buf.validate.field).string.min_len = 1]; // User provides current password or a 2FA code to confirm.
                                   // Server determines which is expected/valid.
  // string user_id = 2; // For admin use cases.
}

// --- GenerateRecoveryCodes ---
message GenerateRecoveryCodesRequest {
  // User must be 2FA enabled. May require re-authentication (password or current 2FA code).
  string password_or_2fa_code = 1; // Optional: for re-authentication before generating new codes.
  // Optional target user for admin use cases. If empty, uses the authenticated user.
  string user_id = 2;
}

message GenerateRecoveryCodesResponse {
  repeated string recovery_codes = 1; // A new set of recovery codes.
}

// --- InitiateHOTPSetup ---
message InitiateHOTPSetupRequest {
  // No fields needed; operates on the currently authenticated user.
  // string user_id = 1; // Could be added for admin use cases later.
}

message InitiateHOTPSetupResponse {
  string secret = 1;         // The base32 encoded HOTP secret.
  string qr_code_uri = 2;    // The otpauth:// URI to be rendered as a QR code.
  uint64 initial_counter = 3; // The initial counter value.
}

// --- VerifyAndEnableHOTP ---
message VerifyAndEnableHOTPRequest {
  string hotp_code = 1 [(buf.validate.field).string.min_len = 1]; // The HOTP code from the user's authenticator app.
}

message VerifyAndEnableHOTPResponse {
  repeated string recovery_codes = 1; // A new set of recovery codes.
}

// --- InitiateEmailMFASetup ---
message InitiateEmailMFASetupRequest {
  // No fields needed; operates on the currently authenticated user.
  // string user_id = 1; // Could be added for admin use cases later.
}

message InitiateEmailMFASetupResponse {
  string message = 1; // Confirmation message that OTP was sent to email.
}

// --- VerifyAndEnableEmailMFA ---
message VerifyAndEnableEmailMFARequest {
  string email_otp = 1 [(buf.validate.field).string.min_len = 1]; // The OTP code sent to user's email.
}

message VerifyAndEnableEmailMFAResponse {
  repeated string recovery_codes = 1; // A new set of recovery codes.
}

// --- SendMFAChallenge ---
message SendMFAChallengeRequest {
  // No fields needed; operates on the currently authenticated user.
  // string user_id = 1; // Could be added for admin use cases later.
}

message SendMFAChallengeResponse {
  string method = 1;         // The MFA method used ("TOTP", "HOTP", "EMAIL", "PUSH").
  string message = 2;        // Confirmation message.
  uint64 counter = 3;        // Current counter for HOTP (if applicable).
  string challenge_id = 4;   // Challenge ID for push MFA (if applicable).
}

// --- VerifyMFAChallenge ---
message VerifyMFAChallengeRequest {
  string code = 1 [(buf.validate.field).string.min_len = 1]; // The MFA code to verify.
  uint64 counter = 2; // Current counter for HOTP verification (if applicable).
}

message VerifyMFAChallengeResponse {
  bool verified = 1; // Whether the code was successfully verified.
}

// --- InitiatePushMFASetup ---
message InitiatePushMFASetupRequest {
  string device_token = 1 [(buf.validate.field).string.min_len = 1]; // Firebase device token.
}

message InitiatePushMFASetupResponse {
  string message = 1; // Confirmation message.
}

// --- VerifyAndEnablePushMFA ---
message VerifyAndEnablePushMFARequest {
  // No additional fields needed; enables push MFA for the authenticated user.
}

message VerifyAndEnablePushMFAResponse {
  repeated string recovery_codes = 1; // A new set of recovery codes.
}

// --- RegisterPushDevice ---
message RegisterPushDeviceRequest {
  string device_token = 1 [(buf.validate.field).string.min_len = 1]; // Firebase device token.
}

message RegisterPushDeviceResponse {
  string message = 1; // Confirmation message.
}

// --- UnregisterPushDevice ---
message UnregisterPushDeviceRequest {
  string device_token = 1 [(buf.validate.field).string.min_len = 1]; // Firebase device token to remove.
}

message UnregisterPushDeviceResponse {
  string message = 1; // Confirmation message.
}

// --- RespondToPushChallenge ---
message RespondToPushChallengeRequest {
  string challenge_id = 1 [(buf.validate.field).string.min_len = 1]; // The challenge ID from the push notification.
  string response = 2 [(buf.validate.field).string.min_len = 1]; // "approve" or "deny".
}

message RespondToPushChallengeResponse {
  string status = 1; // "approved" or "denied".
}

// --- GetPushChallengeStatus ---
message GetPushChallengeStatusRequest {
  string challenge_id = 1 [(buf.validate.field).string.min_len = 1]; // The challenge ID to check.
}

message GetPushChallengeStatusResponse {
  string status = 1; // "pending", "approved", "denied", or "expired".
}

// --- Administrative MFA management ---

message GetMFAStatusRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1]; // ID or email
}

// MFAStatus describes every source that can trigger a second factor.
message MFAStatus {
  bool enabled = 1;                 // Any factor is configured
  bool mfa_required = 2;            // Per-user enforcement flag
  bool realm_requires_mfa = 3;      // Realm-wide enforcement policy
  string effective_trigger = 4;     // TOTP, HOTP, EMAIL, PUSH, METHOD, WEBAUTHN, FLOW, NONE
  bool totp_enabled = 5;            // IsTwoFactorEnabled && method == TOTP && secret set
  bool totp_secret_set = 6;
  bool email_mfa_enabled = 7;
  bool push_mfa_enabled = 8;
  int32 verified_methods = 9;
  int32 webauthn_devices = 10;
  int32 recovery_codes_remaining = 11;
  bool flow_requires_mfa = 12;      // The browser flow has a REQUIRED non-password execution
  repeated string notes = 13;       // Human-readable warnings for operators
}

message GetMFAStatusResponse {
  MFAStatus status = 1;
}

message ResetUserMFARequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1]; // ID or email
  bool remove_passkeys = 2; // Also delete registered WebAuthn devices
}

message ResetUserMFAResponse {
  MFAStatus previous = 1;  // State before the reset, for audit/confirmation
  bool removed_passkeys = 2;
}

message SetUserMFARequiredRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1]; // ID or email
  bool required = 2;
}

message GetMFAPolicyRequest {}

message GetMFAPolicyResponse {
  bool require_mfa = 1;
}

message SetMFAPolicyRequest {
  bool require_mfa = 1;
}
