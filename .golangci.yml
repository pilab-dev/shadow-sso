version: "2"

run:
  timeout: 5m
  concurrency: 10
  tests: false

linters:
  default: none
  enable:
    - govet
    - ineffassign
  settings:
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    goconst:
      min-len: 3
    misspell:
      locale: US
    gocritic:
      enabled-checks:
        - boolExprSimplify
        - builtinShadow
        - commentedOutCode
        - deferInLoop
        - docStub
        - emptyFallthrough
        - equalFold
        - hexLiteral
        - importShadow
        - indexAlloc
        - initClause
        - methodExprCall

output:
  formats:
    text:
      path: stdout
      colors: true

severity:
  default: warning
