{{define "base_start"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>{{if .PageTitle}}{{.PageTitle}}{{else}}Shadow SSO{{end}}</title>
    <style>
        /* Design System Tokens */
        :root {
            --primary-color: {{if .brand_color}}{{.brand_color}}{{else}}#007bff{{end}};
            --primary-hover: color-mix(in srgb, var(--primary-color) 85%, black);
            --primary-active: color-mix(in srgb, var(--primary-color) 75%, black);
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #1a1a2e;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --error-color: #dc2626;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --success-color: #16a34a;
            --success-bg: #f0fdf4;
            --warning-color: #d97706;
            --warning-bg: #fffbeb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
        }

        /* Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }

        /* Layout */
        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-xl);
            border: 1px solid var(--border-color);
        }

        /* Typography */
        .header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .logo {
            max-height: 64px;
            width: auto;
            margin-bottom: var(--spacing-md);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
            margin: 0;
            letter-spacing: -0.025em;
        }

        .page-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 0 0 var(--spacing-xs) 0;
        }

        .page-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* Forms */
        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: var(--spacing-xs);
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            font-family: var(--font-sans);
            color: var(--text-color);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 15%, transparent);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input.error {
            border-color: var(--error-color);
        }

        .form-input.error:focus {
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--error-color) 15%, transparent);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 16px;
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: var(--font-sans);
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
            text-decoration: none;
            line-height: 1.5;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn-primary:active:not(:disabled) {
            background-color: var(--primary-active);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--bg-color);
        }

        .btn-danger {
            background-color: var(--error-color);
            color: #ffffff;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: color-mix(in srgb, var(--error-color) 85%, black);
        }

        /* Social Login Buttons */
        .social-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: var(--spacing-lg) 0;
        }

        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .social-divider span {
            padding: 0 var(--spacing-md);
            font-size: 0.8125rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .btn-social {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            width: 100%;
            padding: 10px 16px;
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: var(--font-sans);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            text-decoration: none;
            color: var(--text-color);
            background: var(--card-bg);
        }

        .btn-social:hover {
            background-color: var(--bg-color);
        }

        .btn-social:active {
            transform: scale(0.98);
        }

        .btn-social svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .btn-social.google {
            border-color: #dadce0;
        }

        .btn-social.google:hover {
            background-color: #f8f9fa;
        }

        .btn-social.github {
            border-color: #333;
        }

        .btn-social.github:hover {
            background-color: #f6f8fa;
        }

        .btn-social.apple {
            border-color: #000;
            color: #000;
        }

        .btn-social.apple:hover {
            background-color: #f5f5f5;
        }

        /* Alerts */
        .alert {
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .alert-error {
            background-color: var(--error-bg);
            color: var(--error-color);
            border: 1px solid var(--error-border);
        }

        .alert-success {
            background-color: var(--success-bg);
            color: var(--success-color);
            border: 1px solid color-mix(in srgb, var(--success-color) 30%, transparent);
        }

        .alert-warning {
            background-color: var(--warning-bg);
            color: var(--warning-color);
            border: 1px solid color-mix(in srgb, var(--warning-color) 30%, transparent);
        }

        /* Links */
        .link {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .link:hover {
            text-decoration: underline;
        }

        .link-center {
            display: block;
            text-align: center;
            margin-top: var(--spacing-md);
        }

        /* Scope List */
        .scope-list {
            list-style: none;
            padding: 0;
            margin: var(--spacing-md) 0;
            background: var(--bg-color);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .scope-item {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .scope-item:last-child {
            border-bottom: none;
        }

        .scope-icon {
            color: var(--success-color);
            flex-shrink: 0;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        .footer-text {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        /* MFA Specific */
        .mfa-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--spacing-md);
            background: var(--bg-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mfa-icon svg {
            width: 32px;
            height: 32px;
            color: var(--primary-color);
        }

        .otp-input {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 0.5em;
            padding: 12px;
        }

        /* Client Info */
        .client-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--bg-color);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
        }

        .client-logo {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            object-fit: contain;
            background: var(--card-bg);
            padding: var(--spacing-xs);
        }

        .client-details {
            flex: 1;
            min-width: 0;
        }

        .client-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-color);
            margin: 0;
        }

        .client-description {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin: 2px 0 0 0;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-lg);
        }

        .actions .btn {
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: var(--spacing-sm);
                align-items: flex-start;
                padding-top: var(--spacing-xl);
            }

            .card {
                padding: var(--spacing-lg);
            }

            .brand-name {
                font-size: 1.25rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.2s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                {{if .brand_logo}}<img src="{{.brand_logo}}" alt="Logo" class="logo">{{end}}
                <h1 class="brand-name">{{if .brand_name}}{{.brand_name}}{{else}}Shadow SSO{{end}}</h1>
            </div>
{{end}}

{{define "base_end"}}
        </div>
        <div class="footer">
            <p class="footer-text">Secured by Shadow SSO</p>
        </div>
    </div>
</body>
</html>
{{end}}
