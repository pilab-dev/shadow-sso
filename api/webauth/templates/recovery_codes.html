{{template "base_start" .}}
<div class="mfa-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
</div>

<h2 class="page-title">Save your recovery codes</h2>
<p class="page-subtitle">Each code works once if you lose your authenticator. They will not be shown again.</p>

<div class="my-4 grid grid-cols-2 gap-1.5 text-center font-mono">
    {{range .Codes}}<code>{{.}}</code>{{end}}
</div>

{{if .ContinueHref}}
<a class="btn btn-primary" href="{{.ContinueHref}}">I have saved my codes — continue</a>
{{else}}
<form method="POST" action="{{.Action}}">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="flow_id" value="{{.FlowID}}">
    <input type="hidden" name="continue" value="1">
    <button type="submit" class="btn btn-primary">I have saved my codes — continue</button>
</form>
{{end}}
{{template "base_end" .}}
