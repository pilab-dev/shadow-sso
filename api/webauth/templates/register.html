{{template "base_start" .}}
<div class="mfa-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
</div>

<h2 class="page-title">Create your account</h2>
<p class="page-subtitle">Register to get started.</p>

{{if .Error}}
<div class="alert alert-error" role="alert">
    <span class="alert-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </span>
    <span>{{.Error}}</span>
</div>
{{end}}

<form method="POST" action="/register">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-group">
        <label for="full_name" class="form-label">Full name</label>
        <input type="text" id="full_name" name="full_name" class="form-input" autocomplete="name" value="{{.FullName}}" required>
    </div>
    <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-input" autocomplete="email" value="{{.Email}}" required>
    </div>
    <div class="form-group">
        <label for="tel" class="form-label">Telephone</label>
        <input type="tel" id="tel" name="tel" class="form-input" autocomplete="tel" value="{{.Tel}}" required>
    </div>
    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input{{if .Error}} error{{end}}" autocomplete="new-password">
    </div>
    <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input{{if .Error}} error{{end}}" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary">Create account</button>
</form>
<a href="/login" class="link link-center" style="margin-top:16px;display:block;">Already have an account? Sign in</a>
{{template "base_end" .}}
