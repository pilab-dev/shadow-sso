{{template "base_start" .}}
<div class="mfa-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
    </svg>
</div>

<h2 class="page-title">Two-Factor Authentication</h2>
<p class="page-subtitle">Enter the 6-digit code from your authenticator app</p>

{{if .Error}}
<div class="alert alert-error" role="alert">
    <span class="alert-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </span>
    <span>{{.Error}}</span>
</div>
{{end}}

<form method="POST" action="/mfa">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="flow_id" value="{{.FlowID}}">

    <div class="form-group">
        <label for="otp" class="form-label">Verification Code</label>
        <input
            type="text"
            id="otp"
            name="otp"
            class="form-input otp-input{{if .Error}} error{{end}}"
            autocomplete="one-time-code"
            placeholder="000000"
            pattern="[0-9]{6}"
            maxlength="6"
            inputmode="numeric"
            required
            autofocus
        >
    </div>

    <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
        Verify
    </button>
</form>

<div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border);">
    <p style="font-size:0.8125rem;color:var(--text-subtle);text-align:center;margin-bottom:10px;">
        Having trouble?
    </p>
    <div style="display:flex;gap:16px;justify-content:center;align-items:center;">
        <a href="/mfa/recovery" class="link">Use recovery code</a>
        <span style="color:var(--border);">•</span>
        <a href="/login" class="link">Sign in differently</a>
    </div>
</div>
{{template "base_end" .}}
