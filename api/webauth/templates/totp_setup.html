{{template "base_start" .}}
<div class="mfa-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
</div>

<h2 class="page-title">Set up your authenticator</h2>
<p class="page-subtitle">Scan the QR code with an authenticator app (Google Authenticator, 1Password, Authy…), then enter the 6-digit code.</p>

{{if .Error}}
<div class="alert alert-error" role="alert">
    <span class="alert-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </span>
    <span>{{.Error}}</span>
</div>
{{end}}

<div style="text-align:center;margin:12px 0;">
    <img src="{{.QRCode}}" alt="QR code for authenticator setup" width="200" height="200" style="background:#fff;padding:8px;border-radius:8px;">
    <p style="font-size:0.8125rem;color:var(--text-subtle);margin-top:8px;">Can't scan? Enter this key manually:</p>
    <code style="font-family:var(--font-mono);word-break:break-all;">{{.Secret}}</code>
</div>

<form method="POST" action="{{.Action}}">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="flow_id" value="{{.FlowID}}">
    <div class="form-group">
        <label for="otp" class="form-label">Verification Code</label>
        <input type="text" id="otp" name="otp" class="form-input otp-input{{if .Error}} error{{end}}"
               autocomplete="one-time-code" placeholder="000000" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary">Verify and enable</button>
</form>
{{template "base_end" .}}
