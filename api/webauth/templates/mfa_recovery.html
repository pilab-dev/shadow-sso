{{template "base_start" .}}
<div class="mfa-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
    </svg>
</div>

<h2 class="page-title">Save your recovery codes</h2>
<p class="page-subtitle">Two-factor authentication is now enabled. Store these codes somewhere safe — each one can be used once if you lose your authenticator.</p>

<div style="background:var(--bg-muted);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:18px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--font-mono);font-size:0.875rem;">
        {{range .RecoveryCodes}}
        <div>{{.}}</div>
        {{end}}
    </div>
</div>

<form method="POST" action="/mfa/enroll/complete">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="flow_id" value="{{.FlowID}}">

    <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><polyline points="20 6 9 17 4 12"/></svg>
        I have saved my codes — continue
    </button>
</form>

<p style="text-align:center;margin-top:16px;font-size:0.8125rem;color:var(--text-subtle);">
    These codes will not be shown again.
</p>
{{template "base_end" .}}
