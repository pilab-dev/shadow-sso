{{template "base_start" .}}
<div class="mfa-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
    </svg>
</div>

<h2 class="page-title">Save your recovery codes</h2>
<p class="page-subtitle">Two-factor authentication is now enabled. Store these codes somewhere safe — each one can be used once if you lose your authenticator.</p>

<div class="mb-4.5 rounded-md border border-line bg-muted-bg p-4">
    <div class="grid grid-cols-2 gap-2 font-mono text-sm">
        {{range .RecoveryCodes}}
        <div>{{.}}</div>
        {{end}}
    </div>
</div>

<form method="POST" action="/mfa/enroll/complete">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="flow_id" value="{{.FlowID}}">

    <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><polyline points="20 6 9 17 4 12"/></svg>
        I have saved my codes — continue
    </button>
</form>

<p class="mt-4 text-center text-[0.8125rem] text-subtle">
    These codes will not be shown again.
</p>
{{template "base_end" .}}
