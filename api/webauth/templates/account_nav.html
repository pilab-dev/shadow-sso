{{define "account_nav"}}
<nav class="mb-4.5 flex flex-wrap justify-center gap-3.5 text-sm" aria-label="Account">
    <a class="link{{if eq .Active "overview"}} border-b-2 border-primary pb-0.5 font-semibold{{end}}" href="/account"{{if eq .Active "overview"}} aria-current="page"{{end}}>Profile</a>
    <a class="link{{if eq .Active "security"}} border-b-2 border-primary pb-0.5 font-semibold{{end}}" href="/account/security"{{if eq .Active "security"}} aria-current="page"{{end}}>Security</a>
    {{if .PasskeysNav}}<a class="link{{if eq .Active "passkeys"}} border-b-2 border-primary pb-0.5 font-semibold{{end}}" href="/account/passkeys"{{if eq .Active "passkeys"}} aria-current="page"{{end}}>Passkeys</a>{{end}}
    <a class="link{{if eq .Active "sessions"}} border-b-2 border-primary pb-0.5 font-semibold{{end}}" href="/account/sessions"{{if eq .Active "sessions"}} aria-current="page"{{end}}>Devices</a>
    <a class="link{{if eq .Active "linked"}} border-b-2 border-primary pb-0.5 font-semibold{{end}}" href="/account/linked"{{if eq .Active "linked"}} aria-current="page"{{end}}>Linked accounts</a>
