{{template "base_start" .}}
<div class="mfa-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
</div>

<h2 class="page-title">Update your password</h2>
<p class="page-subtitle">You must choose a new password before you can continue.</p>

{{if .Error}}
<div class="alert alert-error" role="alert">
    <span class="alert-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </span>
    <span>{{.Error}}</span>
</div>
{{end}}

<form method="POST" action="/required-action">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="flow_id" value="{{.FlowID}}">

    <div class="form-group">
        <label for="new_password" class="form-label">New password</label>
        <input type="password" id="new_password" name="new_password" class="form-input{{if .Error}} error{{end}}"
               autocomplete="new-password" required autofocus>
    </div>
    <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input{{if .Error}} error{{end}}"
               autocomplete="new-password" required>
    </div>

    <button type="submit" class="btn btn-primary">Update password</button>
</form>
{{template "base_end" .}}
