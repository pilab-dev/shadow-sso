{{template "base_start" .}}

<h2 class="page-title">Choose an account</h2>
<p class="page-subtitle">to continue to {{if .BrandName}}{{.BrandName}}{{else}}Shadow SSO{{end}}</p>

{{if .Error}}
<div class="alert alert-error" role="alert">
    <span class="alert-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </span>
    <span>{{.Error}}</span>
</div>
{{end}}

<div class="flex flex-col gap-0.5">
    {{range .Accounts}}
    <form method="POST" action="/login/select" class="m-0">
        <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        <input type="hidden" name="user_id" value="{{.UserID}}">
        <button type="submit" class="flex w-full cursor-pointer items-center gap-3 rounded-md border-0 bg-transparent px-2.5 py-3 text-left text-fg transition hover:bg-surface-hover focus-visible:ring-3 focus-visible:ring-primary-light focus-visible:outline-none">
            <span class="grid size-10 shrink-0 place-items-center rounded-md bg-primary text-sm font-bold text-on-primary select-none" aria-hidden="true">{{.Initials}}</span>
            <span class="flex min-w-0 flex-1 flex-col">
                <span class="truncate text-[0.9375rem] font-medium text-fg">{{if .Name}}{{.Name}}{{else if .Email}}{{.Email}}{{else}}Account{{end}}</span>
                {{if .Email}}<span class="truncate text-[0.8125rem] text-muted">{{.Email}}</span>{{end}}
                <span class="mt-0.5 text-[0.6875rem] {{if eq .StatusTone "current"}}text-ok{{else if eq .StatusTone "signed-in"}}text-primary{{else}}text-subtle{{end}}">{{.StatusText}}</span>
                {{if .LastUsedText}}<span class="text-[0.6875rem] text-subtle">{{.LastUsedText}}</span>{{end}}
            </span>
            <svg class="size-4.5 shrink-0 text-subtle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
    </form>
    {{end}}

    <a class="mt-0.5 flex w-full items-center gap-3 rounded-md px-2.5 py-3 text-left text-fg no-underline transition hover:bg-surface-hover focus-visible:ring-3 focus-visible:ring-primary-light focus-visible:outline-none" href="/login?form=1">
        <span class="grid size-10 shrink-0 place-items-center rounded-md border border-dashed border-line bg-input text-xl font-normal text-muted select-none" aria-hidden="true">+</span>
        <span class="flex min-w-0 flex-1 flex-col">
            <span class="truncate text-[0.9375rem] font-medium text-muted">Use another account</span>
        </span>
    </a>
</div>
{{template "base_end" .}}
