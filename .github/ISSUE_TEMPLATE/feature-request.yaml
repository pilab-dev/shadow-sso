name: Feature Request
description: Got an idea for a feature? Submit it here!
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        1. Please speak English.
        2. Check that a similar idea hasn't already been suggested.
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      placeholder: I think it would be great if shadow-sso had...
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / use case
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
