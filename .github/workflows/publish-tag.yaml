name: Publish Tagged Image to GHCR

on:
  push:
    tags:
      - 'v*' # Trigger on semantic version tags (e.g. v1.2.3), matching auto-tag.yaml

jobs:
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/pilab-dev/shadow-sso-backend:${{ github.ref_name }}
            ghcr.io/pilab-dev/shadow-sso-backend:${{ github.sha }}
            # Tag stable (non-prerelease) releases as latest; empty line is ignored
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/pilab-dev/shadow-sso-backend:latest') || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          # Ensure buildkit is used
          DOCKER_BUILDKIT: 1
