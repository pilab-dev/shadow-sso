name: Build, Test and Coverage

on:
  push:
    branches:
      - main
      - v1
  pull_request:
    branches:
      - main
      - v1 # Also run on PRs targeting v1

jobs:
  build:
    name: Build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: |
          make build

  test:
    name: Test and Coverage
    runs-on: self-hosted
    needs: build # Ensure build is successful before testing
    services:
      mongo:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: --health-cmd "mongo --eval printjson(db.adminCommand('ping'))" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Run Test
        run: go test $(go list ./... | grep -v /gen/ | grep -v /cmd/ | grep -v /helm/) -coverprofile=coverage.txt

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docker_build:
    name: Docker Build and Push
    runs-on: self-hosted
    needs: build # Ensure Go build is successful
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only run on push to main branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/pilab-dev/shadow-sso-backend:main
            ghcr.io/pilab-dev/shadow-sso-backend:${{ github.sha }}
          no-cache: true
        env:
          # Ensure buildkit is used
          DOCKER_BUILDKIT: 1

  silent_login_sdk:
    name: Silent Login SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/silent-login/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: packages/silent-login

      - name: Test
        run: pnpm test
        working-directory: packages/silent-login

      - name: Typecheck
        run: pnpm typecheck
        working-directory: packages/silent-login

      - name: Build
        run: pnpm build
        working-directory: packages/silent-login

  pr_lint:
    name: Validate PR title follows Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
