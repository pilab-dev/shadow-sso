name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Auto-assign to paalgyula
      run: gh issue edit "$NUMBER" --add-assignee paalgyula --repo "$REPO"
      env:
        NUMBER: ${{ github.event.number }}
        REPO: ${{ github.repository }}
